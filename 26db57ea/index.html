<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M_dark جيمنج - ألعاب مجانية</title>
    <style>
        /* CSS Core Styles */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Layout */
        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .search-box input {
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: var(--text-main);
            outline: none;
            width: 250px;
            transition: width 0.3s ease;
        }

        .search-box input:focus {
            width: 300px;
            border-color: var(--accent-color);
        }

        /* Container & Cards */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex-grow: 1;
        }

        .section-title {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            border-right: 4px solid var(--accent-color);
            padding-right: 10px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.2);
        }

        .game-image {
            width: 100%;
            height: 160px;
            background-color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 3rem;
        }

        .game-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .game-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .game-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            flex-grow: 1;
            line-height: 1.4;
        }

        .download-btn {
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 0.6rem;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .download-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Footer */
        footer {
            background-color: var(--card-bg);
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">M_dark جيمنج</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="أبحث عن لعبة..." onkeyup="filterGames()">
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">أحدث الألعاب المجانية</h2>
        <div class="games-grid" id="gamesContainer">
            <!-- سيتم إضافة الألعاب تلقائياً عبر JS -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 M_dark جيمنج - جميع الحقوق محفوظة للألعاب المجانية ومفتوحة المصدر</p>
    </footer>

    <script>
        // بيانات الألعاب التجريبية
        const gamesData = [
            {
                id: 1,
                title: "Cyber Rush 2026",
                description: "لعبة سباقات عصرية مجانية في مدينة مستقبليّة مليئة بالإثارة.",
                icon: "🏎️",
                link: "#"
            },
            {
                id: 2,
                title: "Shadow Warrior",
                description: "لعبة أكشن وتقمص أدوار مع معارك قوية ومراحل متعددة.",
                icon: "⚔️",
                link: "#"
            },
            {
                id: 3,
                title: "Pixel Adventure",
                description: "لعبة منصات بكسل كلاسيكية ممتعة ومناسبة لجميع الأعمار.",
                icon: "🕹️",
                link: "#"
            },
            {
                id: 4,
                title: "Galactic Defender",
                description: "دافع عن كوكبك ضد الهجمات الفضائية في هذا التحدي الحماسي.",
                icon: "🚀",
                link: "#"
            }
        ];

        // عرض الألعاب في الصفحة
        function renderGames(games) {
            const container = document.getElementById('gamesContainer');
            container.innerHTML = '';

            if(games.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">لم يتم العثور على ألعاب مطابقة البحث.</p>';
                return;
            }

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-image">${game.icon}</div>
                    <div class="game-info">
                        <h3 class="game-title">${game.title}</h3>
                        <p class="game-desc">${game.description}</p>
                        <a href="${game.link}" class="download-btn" onclick="triggerDownload('${game.title}')">تحميل الان</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // تصفية الألعاب عند البحث
        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = gamesData.filter(game => 
                game.title.toLowerCase().includes(query) || 
                game.description.toLowerCase().includes(query)
            );
            renderGames(filtered);
        }

        // تنبيه بسيط عند الضغط على التحميل
        function triggerDownload(gameTitle) {
            alert(`جاري تجهيز رابط التحميل للعبة: ${gameTitle}`);
        }

        // تشغيل العرض عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            renderGames(gamesData);
        });
    </script>
</body>
</html>
