<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ON SPORT VIP - البث المباشر</title>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0a0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
        }

        .logo span {
            background: linear-gradient(45deg, #e50914, #ff4b2b);
            padding: 2px 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .developer-badge {
            margin-top: 8px;
            font-size: 0.95rem;
            color: #a0a0ab;
        }

        .developer-badge strong {
            color: #0088cc;
            font-weight: bold;
        }

        .player-card {
            width: 100%;
            max-width: 900px;
            background: #14141d;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid #222230;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* نسبة أبعاد 16:9 */
            height: 0;
            background: #000000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .control-bar {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111118;
            border-top: 1px solid #222230;
            flex-wrap: wrap;
            gap: 12px;
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #00ff87;
            font-weight: 600;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #00ff87;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff87;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .telegram-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #0088cc, #005f9e);
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }

        .telegram-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.5);
            background: linear-gradient(135deg, #0099e6, #006bb3);
        }

        .footer {
            margin-top: 25px;
            color: #666675;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <i class="fas fa-play-circle" style="color: #e50914;"></i> ON SPORT <span>VIP</span>
        </div>

        <div class="control-bar">

    <footer class="footer">

</body>
</html>
