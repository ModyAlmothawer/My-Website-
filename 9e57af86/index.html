<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Am Dark - أون سبورت</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1f1f1f;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00adb5;
        }
        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        .player-section {
            background-color: #1f1f1f;
            height: 400px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            border: 1px solid #333;
        }
        .matches-list {
            background-color: #1f1f1f;
            border-radius: 8px;
            padding: 15px;
        }
        .match-card {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #333;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">AM DARK</div>
        <nav>مباريات اليوم | القنوات | الأرشيف</nav>
    </header>

    <div class="container">
        <!-- مشغل الصوت/الصورة الرئيسي -->
        <div class="player-section">
            <h2>شاشة العرض الرئيسية - قنوات أون سبورت</h2>
        </div>

        <!-- جدول المباريات -->
        <div class="matches-list">
            <h3>جدول مباريات اليوم</h3>
            <div class="match-card">
                <span>الفريق الأول × الفريق الثاني</span>
                <span>ON Time Sports 1</span>
                <span>08:00 مساءً</span>
            </div>
        </div>
    </div>

</body>
</html>
