<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختبار سرعة الإنترنت</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #243b80 0%, transparent 40%),
                linear-gradient(135deg, #050816, #0b1228);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .card {
            background: rgba(17, 25, 55, 0.88);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4);
            backdrop-filter: blur(15px);
        }

        h1 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aab4d4;
            margin-bottom: 35px;
        }

        .speed-circle {
            width: 270px;
            height: 270px;
            margin: 0 auto 35px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle, #101a3c 60%, transparent 61%),
                conic-gradient(#00e5ff 0deg, #536dfe 0deg, #222b4e 0deg);

            border: 8px solid #18234b;
            box-shadow:
                0 0 35px rgba(0,229,255,0.15),
                inset 0 0 30px rgba(0,0,0,0.3);

            transition: 0.3s;
        }

        .speed-circle.testing {
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%,100% {
                transform: scale(1);
                box-shadow: 0 0 30px rgba(0,229,255,.15);
            }

            50% {
                transform: scale(1.03);
                box-shadow: 0 0 55px rgba(0,229,255,.35);
            }
        }

        #speed {
            font-size: 55px;
            font-weight: bold;
            color: #00e5ff;
        }

        .unit {
            color: #9ca8cc;
            font-size: 18px;
            margin-top: 5px;
        }

        #status {
            color: #9ca8cc;
            min-height: 25px;
            margin-bottom: 25px;
        }

        .start-btn {
            border: none;
            outline: none;
            cursor: pointer;
            padding: 16px 45px;
            border-radius: 50px;
            color: white;
            font-size: 18px;
            font-weight: bold;

            background: linear-gradient(135deg, #00c6ff, #536dfe);

            box-shadow: 0 10px 30px rgba(0,198,255,.25);
            transition: .25s;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0,198,255,.4);
        }

        .start-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 35px;
        }

        .result-box {
            background: rgba(255,255,255,.05)
            ;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 15px;
            padding: 20px;
        }

        .result-box .icon {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .result-box h3 {
            color: #9ca8cc;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 23px;
            font-weight: bold;
        }

        .ping {
            color: #00e5ff;
        }

        .download {
            color: #43ff9b;
        }

        .upload {
            color: #ffb347;
        }

        .progress-container {
            width: 100%;
            height: 7px;
            background: #202b50;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00e5ff, #536dfe);
            transition: width .2s;
        }

        .footer {
            color: #68749a;
            margin-top: 25px;
            font-size: 13px;
        }

        @media (max-width: 650px) {

            .card {
                padding: 30px 15px;
            }

            h1 {
                font-size: 27px;
            }

            .speed-circle {
                width: 220px;
                height: 220px;
            }

            #speed {
                font-size: 43px;
            }

            .results {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🌐 اختبار سرعة الإنترنت</h1>

        <p class="subtitle">
            اضغط على الزر لقياس سرعة اتصالك بالإنترنت
        </p>

        <div class="speed-circle" id="speedCircle">

            <div id="speed">0</div>

            <div class="unit">Mbps</div>

        </div>

        <div id="status">
            جاهز لبدء الاختبار
        </div>

        <div class="progress-container">
            <div class="progress" id="progress"></div>
        </div>

        <button
            class="start-btn"
            id="startBtn"
            onclick="startTest()">
            🚀 ابدأ الاختبار
        </button>

        <div class="results">

            <div class="result-box">
                <div class="icon">📡</div>
                <h3>Ping</h3>
                <div class="result-value ping" id="ping">
                    -- ms
                </div>
            </div>

            <div class="result-box">
                <div class="icon">⬇️</div>
                <h3>Download</h3>
                <div class="result-value download" id="download">
                    -- Mbps
                </div>
            </div>

            <div class="result-box">
                <div class="icon">⬆️</div>
                <h3>Upload</h3>
                <div class="result-value upload" id="upload">
                    -- Mbps
                </div>
            </div>

        </div>

        <div class="footer">
            Speed Test • HTML / CSS / JavaScript
        </div>

    </div>

</div>


<script>

const speedElement = document.getElementById("speed");
const pingElement = document.getElementById("ping");
const downloadElement = document.getElementById("download");
const uploadElement = document.getElementById("upload");

const statusElement = document.getElementById("status");
const progressElement = document.getElementById("progress");

const startButton = document.getElementById("startBtn");
const speedCircle = document.getElementById("speedCircle");


function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}


/* =========================
   اختبار Ping
========================= */

async function testPing() {

    statusElement.textContent = "📡 جاري اختبار Ping...";

    let times = [];

    for (let i = 0; i < 3; i++) {

        const start = performance.now();

        try {
        await fetch(
                "https://speed.cloudflare.com/__down?bytes=1000",
                {
                    cache: "no-store"
                }
            );

            const end = performance.now();

            times.push(end - start);

        } catch (error) {
            console.log(error);
        }

    }

    if (times.length === 0) {
        return 0;
    }

    const average =
        times.reduce((a,b) => a + b, 0) / times.length;

    return Math.round(average);
}


/* =========================
   اختبار Download
========================= */

async function testDownload() {

    statusElement.textContent =
        "⬇️ جاري اختبار سرعة التحميل...";

    const testSize = 10 * 1024 * 1024; // 10 MB

    const url =
        "https://speed.cloudflare.com/__down?bytes=" +
        testSize +
        "&cache=" +
        Math.random();

    const start = performance.now();

    try {

        const response = await fetch(url, {
            cache: "no-store"
        });

        const reader = response.body.getReader();

        let received = 0;

        while (true) {

            const { done, value } =
                await reader.read();

            if (done) break;

            received += value.length;

            const elapsed =
                (performance.now() - start) / 1000;

            if (elapsed > 0) {

                const mbps =
                    (received * 8 / elapsed) /
                    1000000;

                speedElement.textContent =
                    mbps.toFixed(1);

                const progress =
                    Math.min(
                        (received / testSize) * 100,
                        100
                    );

                progressElement.style.width =
                    progress + "%";
            }
        }

        const elapsed =
            (performance.now() - start) / 1000;

        const mbps =
            (received * 8 / elapsed) /
            1000000;

        return mbps;

    } catch (error) {

        console.error(error);

        return 0;
    }
}


/* =========================
   Upload
========================= */

async function testUpload() {

    statusElement.textContent =
        "⬆️ جاري اختبار سرعة الرفع...";

    /*
       ملاحظة:
       تحتاج إلى Endpoint خاص بك لقبول POST
       إذا أردت قياس Upload حقيقي.

       هذا الجزء يستخدم endpoint تجريبي.
    */

    const size = 2 * 1024 * 1024;

    const data = new Uint8Array(size);

    crypto.getRandomValues(
        data.subarray(0, 65536)
    );

    const start = performance.now();

    try {

        await fetch(
            "https://speed.cloudflare.com/__up",
            {
                method: "POST",
                body: data,
                cache: "no-store"
            }
        );

        const elapsed =
            (performance.now() - start) / 1000;

        const mbps =
            (size * 8 / elapsed) /
            1000000;

        return mbps;

    } catch (error) {

        console.warn(
            "Upload endpoint غير متاح",
            error
        );

        return 0;
    }
}


/* =========================
   تشغيل الاختبار
========================= */

async function startTest() {

    startButton.disabled = true;

    speedCircle.classList.add("testing");

    speedElement.textContent = "0";

    pingElement.textContent = "-- ms";
    downloadElement.textContent = "-- Mbps";
    uploadElement.textContent = "-- Mbps";

    progressElement.style.width = "0%";


    // Ping

    const ping = await testPing();

    pingElement.textContent =
        ping + " ms";


    await sleep(300);


    // Download

    const download =
        await testDownload();

    downloadElement.textContent =
        download.toFixed(2) + " Mbps";

    speedElement.textContent =
        download.toFixed(1);


    await sleep(500);


    // Upload

    const upload =
        await testUpload();

    if (upload > 0) {

        uploadElement.textContent =
        upload.toFixed(2) + " Mbps";

    } else {

        uploadElement.textContent =
            "N/A";

    }


    progressElement.style.width = "100%";

    statusElement.textContent =
        "✅ انتهى اختبار السرعة";

    speedCircle.classList.remove("testing");

    startButton.disabled = false;
}


/* =========================
   حماية من أخطاء المتصفح
========================= */

window.addEventListener("error", function(event) {

    console.error(
        "Error:",
        event.error
    );

});

</script>

</body>
</html>
