<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تلوين أزرار البوتات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-primary: #3b82f6;
            --accent-success: #22c55e;
            --accent-danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--accent-primary);
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
            margin-bottom: 1rem;
        }

        .drop-zone:hover {
            border-color: var(--accent-primary);
        }

        textarea {
            width: 100%;
            height: 180px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #22c55e;
            padding: 1rem;
            font-family: monospace;
            direction: ltr;
            text-align: left;
            resize: vertical;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .color-selector {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary { background-color: var(--accent-primary); color: white; }
        .btn-success { background-color: var(--accent-success); color: white; }
        .btn-danger { background-color: var(--accent-danger); color: white; }

        .result-card {
            display: none;
        }

        .stats {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
        }

        .stat-item {
            background-color: #0b0f19;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            flex: 1;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-value {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--accent-primary);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .code-preview {
            background-color: #0b0f19;
            padding: 1rem;
            border-radius: 8px;
            max-height: 250px;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
            font-family: monospace;
            white-space: pre-wrap;
            border: 1px solid var(--border-color);
        }

        .highlight-style {
            background-color: rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: bold;
        }

        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            color: white;
            display: none;
            z-index: 1000;
        }

        .toast-success { background-color: var(--accent-success); }
        .toast-warning { background-color: #f59e0b; }
        .toast-error { background-color: var(--accent-danger); }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>أداة تلوين أزرار كود البوت</h1>
            <p class="subtitle">قم برفع ملف البوت (Python أو PHP) أو لصق الكود لتطبيق الألوان على الأزرار الشفافة</p>

            <div class="drop-zone" id="dropZone">
                <p>إسقاط الملف هنا أو اضغط للاختيار</p>
                <input type="file" id="fileInput" style="display: none;" accept=".py,.php,.txt">
            </div>

            <textarea id="codeInput" placeholder="أو قم بلصق كودك هنا مباشرة..."></textarea>

            <div class="controls">
                <div class="color-selector">
                    <label>اختر اللون:</label>
                    <select id="colorSelect" style="padding: 0.5rem; border-radius: 6px; background: #0b0f19; color: white; border: 1px solid var(--border-color);">
                        <option value="primary">أزرق (Primary)</option>
                        <option value="success">أخضر (Success)</option>
                        <option value="danger">أحمر (Danger)</option>
                        <option value="random">عشوائي (Random)</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="processCode()">تطبيق التلوين</button>
            </div>
        </div>

        <div class="card result-card" id="resultCard">
            <h2>النتيجة</h2>
            <p id="resultFileName" style="color: var(--text-muted); font-size: 0.85rem;"></p>
            
            <div class="stats" id="resultStats"></div>

            <div class="code-preview" id="codePreview"></div>

            <div class="controls">
                <button class="btn btn-success" onclick="downloadFile()">تحميل الملف المعدل</button>
                <button class="btn btn-primary" onclick="copyToClipboard()">نسخ الكود</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        (function() {
            const AppState = {
                fileName: '',
                processedContent: ''
            };

            const DOM = {
                dropZone: document.getElementById('dropZone'),
                fileInput: document.getElementById('fileInput'),
                codeInput: document.getElementById('codeInput'),
                colorSelect: document.getElementById('colorSelect'),
                resultCard: document.getElementById('resultCard'),
                resultFileName: document.getElementById('resultFileName'),
                resultStats: document.getElementById('resultStats'),
                codePreview: document.getElementById('codePreview'),
                toast: document.getElementById('toast')
            };

            const Toast = {
                show(msg, type) {
                    DOM.toast.textContent = msg;
                    DOM.toast.className = `toast-${type}`;
                    DOM.toast.style.display = 'block';
                    setTimeout(() => { DOM.toast.style.display = 'none'; }, 3000);
                },
                success(msg) { this.show(msg, 'success'); },
                warning(msg) { this.show(msg, 'warning'); },
                error(msg) { this.show(msg, 'error'); }
            };

            const Utils = {
                escapeHTML(str) {
                    return str.replace(/[&<>'"]/g, 
                        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#x27;', '"': '&quot;' }[tag] || tag)
                    );
                }
            };

            // File Handlers
            DOM.dropZone.addEventListener('click', () => DOM.fileInput.click());
            DOM.fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
            DOM.dropZone.addEventListener('dragover', (e) => e.preventDefault());
            DOM.dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                handleFiles(e.dataTransfer.files);
            });

            function handleFiles(files) {
                if (!files.length) return;
                const file = files[0];
                AppState.fileName = file.name;
                const reader = new FileReader();
                reader.onload = (e) => {
                    DOM.codeInput.value = e.target.result;
                    Toast.success(`تم تحميل الملف: ${file.name}`);
                };
                reader.readAsText(file);
            }

            // Processing Logic
            window.processCode = function() {
                const content = DOM.codeInput.value;
                if (!content.trim()) {
                    Toast.warning('الرجاء إدخال الكود أو رفع ملف أولاً');
                    return;
                }

                const color = DOM.colorSelect.value;
                const isPHP = AppState.fileName.endsWith('.php') || content.includes('<?php');
                
                let modifiedCount = 0;
                let totalProcessed = 0;

                const getColor = () => {
                    if (color === 'random') {
                        const colors = ['primary', 'success', 'danger'];
                        return colors[Math.floor(Math.random() * colors.length)];
                    }
                    return color;
                };

                let newContent = '';

                if (!isPHP) {
                    // Python button parser
                    const regex = /InlineKeyboardButton\s*\(([^)]+)\)/g;
                    newContent = content.replace(regex, (match, p1) => {
                        totalProcessed++;
                        const currentColor = getColor();
                        const updated = modifyPythonButton(match, currentColor);
                        if (updated !== match) modifiedCount++;
                        return updated;
                    });
                } else {
                    // PHP button parser
                    const regex = /InlineKeyboardButton\s*::\s*make\s*\(([^)]+)\)/g;
                    newContent = content.replace(regex, (match, p1) => {
                        totalProcessed++;
                        const currentColor = getColor();
                        const updated = modifyPHPButton(match, currentColor);
                        if (updated !== match) modifiedCount++;
                        return updated;
                    });
                }

                AppState.processedContent = newContent;
                showResult(newContent, modifiedCount, totalProcessed, color);
            };

            function modifyPythonButton(definition, color) {
                let modified = definition;
                if (/style\s*=\s*["'][^"']*["']/.test(modified)) {
                    modified = modified.replace(/style\s*=\s*["'][^"']*["']/, `style="${color}"`);
                } else {
                    const lastParenIndex = modified.lastIndexOf(')');
                    if (lastParenIndex !== -1) {
                        const hasArgs = modified.substring(modified.indexOf('(') + 1, lastParenIndex).trim().length > 0;
                        const separator = hasArgs ? ', ' : '';
                        modified = modified.slice(0, lastParenIndex) + `${separator}style="${color}"` + modified.slice(lastParenIndex);
                    }
                }
                return modified;
            }

            function modifyPHPButton(definition, color) {
                let modified = definition;
                if (/'style'\s*=>\s*['"]/.test(modified)) {
                    modified = modified.replace(/'style'\s*=>\s*['"][^'"]*['"]/, `'style' => '${color}'`);
                } else if (/"style"\s*=>\s*['"]/.test(modified)) {
                    modified = modified.replace(/"style"\s*=>\s*['"][^'"]*['"]/, `"style" => "${color}"`);
                } else {
                    if (modified.includes(']')) {
                        const lastBracket = modified.lastIndexOf(']');
                        const hasArgs = modified.substring(modified.indexOf('[') + 1, lastBracket).trim().length > 0;
                        const separator = hasArgs ? ', ' : '';
                        modified = modified.slice(0, lastBracket) + `${separator}'style' => '${color}'` + modified.slice(lastBracket);
                    } else if (modified.includes(')')) {
                        const lastParen = modified.lastIndexOf(')');
                        const hasArgs = modified.substring(modified.indexOf('(') + 1, lastParen).trim().length > 0;
                        const separator = hasArgs ? ', ' : '';
                        modified = modified.slice(0, lastParen) + `${separator}'style' => '${color}'` + modified.slice(lastParen);
                    }
                }
                return modified;
            }

            // Show Result
            function showResult(content, modifiedCount, totalProcessed, color) {
                DOM.resultCard.style.display = 'block';
                DOM.resultFileName.textContent = `colored_${AppState.fileName || 'script.py'}`;

                const escaped = Utils.escapeHTML(content);
                const highlighted = escaped.replace(/(style\s*=\s*&quot;[^&]*&quot;|style\s*=\s*&#x27;[^&]*&#x27;|&#x27;style&#x27;\s*=&gt;\s*&#x27;[^&]*&#x27;)/g, '<span class="highlight-style">$1</span>');
                DOM.codePreview.innerHTML = highlighted;

                const colorNames = { primary: 'أزرق', success: 'أخضر', danger: 'أحمر', random: 'عشوائي' };
                DOM.resultStats.innerHTML = `
                    <div class="stat-item">
                        <div class="stat-value">${modifiedCount}</div>
                        <div class="stat-label">أزرار معدلة</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${totalProcessed}</div>
                        <div class="stat-label">إجمالي المعالجة</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${colorNames[color] || color}</div>
                        <div class="stat-label">اللون المطبق</div>
                    </div>
                `;

                setTimeout(() => {
                    DOM.resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 300);
            }

            // Export Actions
            window.downloadFile = function() {
                if (!AppState.processedContent) {
                    Toast.warning('لا يوجد كود معدل للتحميل');
                    return;
                }
                const blob = new Blob([AppState.processedContent], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `colored_${AppState.fileName || 'script.py'}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                Toast.success('تم تحميل الملف بنجاح');
            };

            window.copyToClipboard = function() {
                if (!AppState.processedContent) {
                    Toast.warning('لا يوجد كود لنسخه');
                    return;
                }
                navigator.clipboard.writeText(AppState.processedContent)
                    .then(() => Toast.success('تم نسخ الكود بنجاح!'))
                    .catch(() => Toast.error('فشل في نسخ الكود'));
            };

        })();
    </script>
</body>
</html>
