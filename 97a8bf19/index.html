    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glow-color: #3b82f6;
            --bg-gradient: linear-gradient(135deg, #020617, #0f172a, #1e293b);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background: var(--bg-gradient);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .profile-container {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 45px 35px;
            border-radius: 28px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        0 0 50px rgba(59, 130, 246, 0.05);
            z-index: 2;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInContainer 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .profile-img-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
            cursor: default;
        }

        .protection-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        .profile-img-wrapper::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #3b82f6);
            z-index: 1;
            opacity: 0.8;
            filter: blur(8px);
            animation: pulseGlow 3s infinite linear;
        }

        .name {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff 60%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .bio {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 35px;
            line-height: 1.6;
            white-space: pre-line;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 26px;
            border-radius: 16px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: translateY(20px);
        }

        .link-card i {
            font-size: 24px;
            z-index: 2;
        }

        .link-text {
            flex-grow: 1;
            text-align: right;
            margin-right: 18px;
            z-index: 2;
            letter-spacing: 0.5px;
        }

        .chevron-icon {
            font-size: 14px !important;
            opacity: 0.6;
            transition: transform 0.3s ease;
            z-index: 2;
        }

        /* تأثير اللمعان الممتد المشترك للجميع */
        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.25),

            transition: all 0.6s ease;
            z-index: 1;

        .link-card:hover {
            transform: translateY(-5px) scale(1.02);

        .link-card:hover::before {

        /* --- استايل التيك توك المميز (نمط مختلف ولكن بنفس التأثير) --- */

            /* إطار متدرج بألوان التيك توك (سماوي وأحمر) */
            background-image: linear-gradient(#000000, #000000), linear-gradient(135deg, #00f2ea, #ff0050);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: 0 6px 20px rgba(255, 0, 80, 0.2), inset 0 1px 1px rgba(255,255,255,0.05);
        }
        /* تأثير التوهج المزدوج عند المرور (خاص بالتيك توك) */

            box-shadow: 0 10px 30px rgba(0, 242, 234, 0.3), 0 10px 30px rgba(255, 0, 80, 0.3);
            transform: translateY(-5px) scale(1.02);
        }

        /* قسم الحقوق */
        .copyrights-section {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
            letter-spacing: 1px;
            z-index: 2;
            opacity: 0;
            animation: fadeInItem 1s 1s ease forwards;
            line-height: 1.8;
        }

        .copyrights-section span {
            font-weight: 700;
            color: #94a3b8;
            text-shadow: 0 0 10px rgba(148, 163, 184, 0.2);
        }

        .copyrights-section i {
            color: #ef4444;
            font-size: 11px;
            margin: 0 3px;
            animation: heartBeat 1.5s infinite ease-in-out;
            display: inline-block;
        }

        /* زر الواتساب العائم */
        .dev-whatsapp-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #25D366;
            color: white;
            padding: 15px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
            z-index: 999;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
            animation: fadeInItem 1s 1.2s ease forwards, floatingEffect 3s ease-in-out infinite;
            opacity: 0;
        }
        .dev-whatsapp-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.6);
        }
        .dev-whatsapp-btn i { font-size: 20px; }

        /* أنيميشنات */
        @keyframes floatingEffect {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        @keyframes fadeInContainer {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInItem {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
            0% { transform: rotate(0deg); filter: blur(8px); }
            50% { filter: blur(12px); opacity: 1; }
            100% { transform: rotate(360deg); filter: blur(8px); }
        }

        /* تأخير تتابعي للبطاقات */
        .link-card:nth-child(1) { animation: fadeInItem 0.6s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .link-card:nth-child(2) { animation: fadeInItem 0.6s 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .link-card:nth-child(3) { animation: fadeInItem 0.6s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .link-card:nth-child(4) { animation: fadeInItem 0.6s 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>

    <script>
        // --- 1. حماية المحتوى ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        
        document.addEventListener('keydown', function(event) {
            if (event.keyCode === 123) { 
                event.preventDefault();
                return false;
            }
            if (event.ctrlKey && (event.key === 's' || event.key === 'u' || event.key === 'i' || event.key === 'c' || event.shiftKey)) {
                event.preventDefault();
                return false;
            }
        });

        // --- 2. محرك الجزيئات ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const numParticles = 45; 
        const particles = [];

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > width) this.speedX *= -1;
                if (this.y < 0 || this.y > height) this.speedY *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(59, 130, 246, ${this.opacity})`;
                ctx.fill();
            }
        }

        function init() {
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 110) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(59, 130, 246, ${0.12 - (distance/110) * 0.12})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
